# Server
server.port=8082

spring.application.name=tarakki-work-management
spring.datasource.url=jdbc:postgresql://localhost:5432/tarakki_local
spring.datasource.username=tarakki
spring.datasource.password=tarakki
spring.datasource.driver-class-name =org.postgresql.Driver

spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=10

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

audit.logging.topic=${AUDIT_LOGGING_TOPIC:audit-logging}

logging.level.org.apache.kafka.clients.producer=DEBUG

base-url=http://localhost:8080
member.api.endpoint=/api/members

restclient.connect-timeout-ms=3000
restclient.read-timeout-ms=5000